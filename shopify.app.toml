# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e21abfc566fccf991974575d334b6cb1"
name = "flutter-new-app"
application_url = "https://fluter-connect.onrender.com"
embedded = true

[access_scopes]
scopes = "read_customers,read_orders,write_app_proxy,write_customers"

[app_proxy]
url = "/flutter-proxy"
prefix = "apps"
subpath = "flutter-sync"

[auth]
redirect_urls = [ "https://fluter-connect.onrender.com/auth/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/orders-create"
  topics = [ "orders/create" ]

[build]
automatically_update_urls_on_dev = true
