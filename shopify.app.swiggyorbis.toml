client_id = "74c5fa4a9092c0af85d3c822e03563e4"
name = "flutter-connect-swiggyorbis"
application_url = "https://orbis-swiggy-06.onrender.com"
embedded = true

[access_scopes]
scopes = "read_customers,read_orders,write_orders,read_products,write_app_proxy,write_customers"

[app_proxy]
url = "/flutter-proxy"
prefix = "apps"
subpath = "flutter-sync"

[auth]
redirect_urls = [ "https://orbis-swiggy-06.onrender.com/auth/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/orders-create"
  topics = [ "orders/create" ]

[build]
automatically_update_urls_on_dev = true
